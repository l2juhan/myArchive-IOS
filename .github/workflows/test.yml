name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint lint --strict

      # 실기기 전용 테스트 정책(CLAUDE.md): CI는 시뮬레이터를 쓰지 않는다.
      # runner엔 실기기가 없으므로 서명 없이 실기기 타깃(generic/platform=iOS)으로
      # 컴파일 정합성만 검증한다. 동작/단위 테스트는 로컬 실기기에서 수행.
      - name: Build (실기기 타깃, 서명 없음)
        run: |
          xcodebuild -project myArchive.xcodeproj -scheme myArchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Structural checks
        run: bash __tests__/structural/structure-check.sh
